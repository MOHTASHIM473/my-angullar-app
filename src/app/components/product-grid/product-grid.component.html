<section id="products" class="products-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="display-5 fw-bold">Our Products</h2>
      <p class="lead text-muted">Discover our curated collection of premium products</p>
    </div>

    <!-- Search and Filter -->
    <div class="row mb-4">
      <div class="col-lg-6 mb-3 mb-lg-0">
        <div class="input-group">
          <input type="text" 
                 class="form-control" 
                 placeholder="Search products..." 
                 [value]="searchQuery"
                 (input)="onSearchChange($event)">
          <span class="input-group-text">
            <i class="bi bi-search"></i>
          </span>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="d-flex flex-wrap gap-2 justify-content-lg-end">
          <button *ngFor="let category of categories"
                  class="btn btn-outline-secondary"
                  [class.btn-primary]="selectedCategory === category"
                  [class.btn-outline-secondary]="selectedCategory !== category"
                  (click)="onCategoryChange(category)">
            {{ category }}
          </button>
        </div>
      </div>
    </div>

    <!-- Products Grid -->
    <div class="row g-4">
      <div class="col-md-6 col-lg-4 col-xl-3" *ngFor="let product of filteredProducts">
        <div class="card product-card h-100">
          <div class="card-img-top-wrapper">
            <img [src]="product.image" 
                 [alt]="product.title" 
                 class="card-img-top">
            <span class="badge bg-primary position-absolute top-0 end-0 m-2">
              {{ product.category }}
            </span>
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ product.title }}</h5>
            <div class="rating mb-2">
              <span class="text-warning">{{ getStarRating(product.rating) }}</span>
              <span class="text-muted small">({{ product.rating }})</span>
            </div>
            <p class="card-text text-muted small flex-grow-1">{{ product.description }}</p>
            <div class="d-flex justify-content-between align-items-center mt-3">
              <span class="price fw-bold fs-5">${{ product.price.toFixed(2) }}</span>
              <button class="btn btn-primary btn-sm" (click)="addToCart(product)">
                <i class="bi bi-cart-plus"></i> Add to Cart
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- No Results Message -->
    <div *ngIf="filteredProducts.length === 0" class="text-center py-5">
      <i class="bi bi-search display-1 text-muted"></i>
      <h3 class="mt-3">No products found</h3>
      <p class="text-muted">Try adjusting your search or filter criteria</p>
    </div>
  </div>
</section>
