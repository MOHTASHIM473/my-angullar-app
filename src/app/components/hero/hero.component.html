<section class="hero-section">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-6">
        <div class="hero-content">
          <h1 class="display-4 fw-bold mb-3">Summer Sale</h1>
          <h2 class="h2 mb-4">Up to 50% Off</h2>
          <p class="lead mb-4">Discover amazing deals on electronics, fashion, and accessories. Limited time offer!</p>
          <a href="#products" class="btn btn-primary btn-lg px-5 py-3" (click)="scrollToProducts()">
            Shop Now <i class="bi bi-arrow-right"></i>
          </a>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="hero-image">
          <img src="https://images.unsplash.com/photo-1483985988355-763728e1935b?w=800&h=600&fit=crop" 
               alt="Shopping" class="img-fluid rounded-4 shadow">
        </div>
      </div>
    </div>
  </div>
</section>
